name: Linux ARM64 CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    env:
      SIMPLEIDE_EXPECTED_PLATFORM: linux-arm64
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25", "27"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Install language toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential mono-devel nodejs python3

      - name: Verify language toolchains
        run: |
          command -v gcc
          command -v g++
          command -v as
          command -v mcs
          command -v mono
          command -v node
          command -v python3
          test "$(node -p 'process.arch')" = arm64
          python3 -c 'import platform; assert platform.machine().lower() in ("aarch64", "arm64")'
          mono --version | grep -Eq 'Architecture: (arm64|aarch64)'

      - name: Run tests
        run: make test