name: Linux ARM64 CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    container:
      image: alpine:3.22
    env:
      SIMPLEIDE_EXPECTED_PLATFORM: linux-arm64

    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25", "27"]

    steps:
      - name: Prepare Alpine environment
        shell: sh
        run: |
          set -eu

          apk update
          apk add --no-cache \
            bash \
            ca-certificates \
            curl \
            file \
            git \
            gcompat \
            nodejs \
            python3 \
            build-base \
            go \
            mono \
            rust \
            cargo \
            fakeroot \
            rpm \
            dpkg \
            tar \
            unzip \
            zip

          update-ca-certificates

          echo "Alpine version:"
          cat /etc/alpine-release

          echo "Architecture:"
          apk --print-arch
          test "$(apk --print-arch)" = "aarch64"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify language toolchains
        shell: bash
        run: |
          set -euo pipefail

          command -v gcc
          command -v g++
          command -v make
          command -v mcs
          command -v mono
          command -v go
          command -v rustc
          command -v cargo
          command -v node
          command -v python3

          test "$(uname -m)" = "aarch64"
          test "$(go env GOOS)" = "linux"
          test "$(go env GOARCH)" = "arm64"

          rustc -vV | grep -Eq '^host: aarch64-.*-linux-musl$'

          test "$(node -p 'process.arch')" = "arm64"

          python3 -c \
            'import platform; assert platform.machine().lower() in ("aarch64", "arm64")'

          mono --version
          mcs --version

          file -L "$(command -v mono-sgen)" |
            grep -Eq 'ELF 64-bit.*(ARM aarch64|AArch64)'

          java -version 2>&1
          java -XshowSettings:properties -version 2>&1 |
            grep -Eq 'os.arch = aarch64'

          make --version | grep -q "GNU Make"

      - name: Run tests
        shell: bash
        run: make test

      - name: Validate fat JAR and generated packages
        if: matrix.java == '17'
        env:
          SIMPLEIDE_PKG_OS: linux
          SIMPLEIDE_PKG_ARCH: arm64
        shell: bash
        run: |
          set -euo pipefail
          make pkg-verify

      - name: Upload invalid packages for debugging
        if: failure() && matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: invalid-packages-linux-arm64
          path: simpleide/target/pkg/
          if-no-files-found: ignore
          retention-days: 7

      - name: Report failed tests
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          failures = 0
          for report in sorted(glob.glob('*/target/surefire-reports/TEST-*.xml')):
              try:
                  root = ET.parse(report).getroot()
              except Exception as error:
                  print(f"::warning::Unable to parse {report}: {error}")
                  continue
              for case in root.iter('testcase'):
                  for kind in ('failure', 'error'):
                      node = case.find(kind)
                      if node is None:
                          continue
                      failures += 1
                      name = f"{case.get('classname')}.{case.get('name')}"
                      message = (node.get('message') or node.text or kind).strip()
                      message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f"::error title={name}::{message[:1500]}")
          print(f"Surefire reported {failures} failed or errored test(s).")
          PY
