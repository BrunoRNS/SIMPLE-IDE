name: Linux ARM64 CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Linux ARM64 (Debian 10)

    runs-on: ubuntu-24.04-arm

    env:
      SIMPLEIDE_EXPECTED_PLATFORM: linux-arm64
      # Linux arm64 always builds the nojavafx media variant, so every JDK
      # exercises the Debian 10 (glibc 2.28) baseline.

    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25", "27"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: linux-arm64-debian10-maven-${{ matrix.java }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: linux-arm64-debian10-maven-${{ matrix.java }}-

      - name: Prepare Maven cache
        run: mkdir -p "$HOME/.m2"

      - name: Run tests and build packages in Debian 10
        env:
          SIMPLEIDE_CI_JAVA: ${{ matrix.java }}
          SIMPLEIDE_CI_ARCH: arm64
          BUILD_PACKAGES: ${{ matrix.java == '17' || matrix.java == '21' }}
          VALIDATE_CONSUMER: ${{ matrix.java == '17' || matrix.java == '25' }}
        run: |
          set -eu

          tasks="test"
          if [ "$BUILD_PACKAGES" = "true" ]; then
            tasks="test pkg"
          fi
          if [ "$VALIDATE_CONSUMER" = "true" ]; then
            tasks="$tasks consumer"
          fi

          bash scripts/ci/run-linux-debian.sh linux/arm64 $tasks

      - name: Report failed tests
        if: failure()
        shell: bash
        run: python3 scripts/ci/report-surefire.py
