name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  metadata:
    name: Read version and release type
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read application version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version=//p' simpleide/src/main/resources/simpleide.properties | tr -d '\r' | head -n 1)"
          test -n "$VERSION"
          TAG="v$VERSION"
          if printf '%s' "$VERSION" | grep -qi 'beta'; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  fat-jar:
    name: Fat JAR
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build executable fat JAR
        run: make jar

      - name: Stage fat JAR
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          mkdir -p dist
          cp simpleide/target/simpleide.jar \
            "dist/simpleide-v${VERSION}-any-with-deps.jar"

      - name: Upload fat JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: fat-jar
          path: dist/simpleide-v*-any-with-deps.jar
          if-no-files-found: error

  packages:
    name: Package ${{ matrix.pkg_os }}-${{ matrix.pkg_arch }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pkg_os: linux
            pkg_arch: x64
            java_arch: x64
          - os: ubuntu-24.04-arm
            pkg_os: linux
            pkg_arch: arm64
            java_arch: aarch64
          - os: ubuntu-latest
            pkg_os: linux
            pkg_arch: x86
            java_arch: x86
          - os: macos-13
            pkg_os: macos
            pkg_arch: x64
            java_arch: x64
          - os: macos-latest
            pkg_os: macos
            pkg_arch: arm64
            java_arch: aarch64
          - os: windows-latest
            pkg_os: windows
            pkg_arch: x64
            java_arch: x64
          - os: windows-latest
            pkg_os: windows
            pkg_arch: x86
            java_arch: x86
          - os: windows-11-arm
            pkg_os: windows
            pkg_arch: arm64
            java_arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        if: matrix.os != 'windows-11-arm'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          architecture: ${{ matrix.java_arch }}
          cache: maven

      - name: Set up Windows ARM64 Java
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        env:
          JDK_ARCHIVE: zulu17.70.113-ca-jdk17.0.21.0.3-win_aarch64.zip
        run: |
          $downloadUrl = "https://github.com/BrunoRNS/homebrew-jdk-holder-windows-arm/releases/download/v1.0.0/$env:JDK_ARCHIVE"
          $archivePath = Join-Path $env:RUNNER_TEMP $env:JDK_ARCHIVE
          $extractPath = Join-Path $env:RUNNER_TEMP "zulu-jdk-17"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath
          $javaExecutable = Get-ChildItem -LiteralPath $extractPath -Filter java.exe -Recurse |
            Where-Object { $_.Directory.Name -eq "bin" } |
            Select-Object -First 1
          if ($null -eq $javaExecutable) {
            throw "Could not find java.exe in the downloaded JDK archive."
          }
          $jdkHome = $javaExecutable.Directory.Parent.FullName
          Add-Content -Path $env:GITHUB_ENV -Value "JAVA_HOME=$jdkHome"
          Add-Content -Path $env:GITHUB_PATH -Value "$jdkHome\bin"
          & $javaExecutable.FullName -version

      - name: Install Linux packaging dependencies
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot rpm

      - name: Ensure WiX toolset for the .msi build
        if: matrix.os == 'windows-latest' || matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          if (-not (Get-Command candle -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
          }

      - name: Build packages
        env:
          SIMPLEIDE_PKG_OS: ${{ matrix.pkg_os }}
          SIMPLEIDE_PKG_ARCH: ${{ matrix.pkg_arch }}
        run: make pkg

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.pkg_os }}-${{ matrix.pkg_arch }}
          path: simpleide/target/pkg/simpleide-v*-${{ matrix.pkg_os }}-${{ matrix.pkg_arch }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - metadata
      - fat-jar
      - packages
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          TAG: ${{ needs.metadata.outputs.tag }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d dist ] || [ -z "$(find dist -type f -print -quit)" ]; then
            echo "No release artifacts were downloaded." >&2
            exit 1
          fi

          PRERELEASE_FLAG=()
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG=(--prerelease)
          fi

          TITLE="Simple IDE $VERSION"
          NOTES="Simple IDE $VERSION release."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" "${PRERELEASE_FLAG[@]}"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              "${PRERELEASE_FLAG[@]}"
          fi

          mapfile -d '' RELEASE_FILES < <(find dist -maxdepth 1 -type f -print0)
          gh release upload "$TAG" "${RELEASE_FILES[@]}" --clobber
