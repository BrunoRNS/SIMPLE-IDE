name: Linux x86 CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SIMPLEIDE_EXPECTED_PLATFORM: linux-x86
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up 32-bit Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          architecture: x86
          cache: maven

      - name: Configure Docker DNS
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("/etc/docker/daemon.json")

          config = {}
          if path.exists() and path.read_text().strip():
              config = json.loads(path.read_text())

          config["dns"] = ["1.1.1.1", "8.8.8.8"]

          path.write_text(json.dumps(config, indent=2) + "\n")
          PY

          sudo systemctl restart docker
          docker info >/dev/null

      - name: Build 32-bit language toolchain image
        run: |
          mkdir -p "$RUNNER_TEMP/linux-x86-image"
          cat > "$RUNNER_TEMP/linux-x86-image/Dockerfile" <<'DOCKERFILE'
          FROM debian:bookworm-slim

          ENV DEBIAN_FRONTEND=noninteractive

          RUN set -eux; \
              test "$(dpkg --print-architecture)" = "i386"; \
              printf '%s\n' \
                'Acquire::Retries "5";' \
                'Acquire::http::Timeout "30";' \
                'Acquire::https::Timeout "30";' \
                > /etc/apt/apt.conf.d/80-retries; \
              apt-get update; \
              apt-get install -y --no-install-recommends \
                  ca-certificates \
                  curl \
                  file \
                  g++ \
                  gcc \
                  binutils \
                  golang-go \
                  make \
                  mono-complete \
                  rustc \
                  python3 \
                  xz-utils; \
              curl --retry 5 \
                  --retry-all-errors \
                  --fail \
                  --location \
                  --silent \
                  --show-error \
                  https://nodejs.org/dist/v8.17.0/node-v8.17.0-linux-x86.tar.xz \
                  -o /tmp/node.tar.xz; \
              tar -xJf /tmp/node.tar.xz -C /opt; \
              ln -s /opt/node-v8.17.0-linux-x86/bin/node /usr/local/bin/node; \
              rm /tmp/node.tar.xz; \
              rm -rf /var/lib/apt/lists/*
          DOCKERFILE

          docker build \
            --pull \
            --platform linux/386 \
            --tag simpleide-linux-x86:ci \
            "$RUNNER_TEMP/linux-x86-image"

      - name: Verify 32-bit language toolchains
        run: |
          docker run --rm --platform linux/386 \
            --volume "$JAVA_HOME:$JAVA_HOME:ro" \
            --env JAVA_HOME="$JAVA_HOME" \
            --env PATH="$JAVA_HOME/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            simpleide-linux-x86:ci sh -eu -c '
              test "$(dpkg --print-architecture)" = "i386"

              java -XshowSettings:properties -version 2>&1 \
                | grep -q "sun.arch.data.model = 32"

              test "$(node --version)" = v8.17.0
              test "$(node -p "process.arch")" = ia32

              test "$(python3 -c "import struct; print(struct.calcsize(\"P\") * 8)")" = 32

              command -v gcc
              command -v g++
              command -v mcs
              command -v mono
              command -v go
              command -v rustc

              test "$(go env GOOS)" = linux
              test "$(go env GOARCH)" = 386

              rustc -vV | grep -Eq "^host: i[3-6]86-unknown-linux-gnu$"

              g++ -dumpmachine | grep -Eq "^i[3-6]86-|^i686-"
              gcc -dumpmachine | grep -Eq "^i[3-6]86-|^i686-"

              file -L "$(command -v mono)" \
                | grep -Eq "ELF 32-bit.*Intel (i386|80386)"

              file -L "$(command -v node)" \
                | grep -q "ELF 32-bit"
            '

      - name: Run tests
        run: |
          docker run --rm --platform linux/386 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$JAVA_HOME:$JAVA_HOME:ro" \
            --volume "$HOME/.m2:/root/.m2" \
            --workdir /workspace \
            --env JAVA_HOME="$JAVA_HOME" \
            --env PATH="$JAVA_HOME/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            --env SIMPLEIDE_EXPECTED_PLATFORM=linux-x86 \
            simpleide-linux-x86:ci make test

      - name: Validate fat JAR and generated packages
        env:
          SIMPLEIDE_PKG_OS: linux
          SIMPLEIDE_PKG_ARCH: x86
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot rpm
          make pkg-verify

      - name: Upload invalid packages for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: invalid-packages-linux-x86
          path: simpleide/target/pkg/
          if-no-files-found: ignore
          retention-days: 7
