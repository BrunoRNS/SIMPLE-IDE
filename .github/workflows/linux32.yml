name: Linux x86 CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Linux x86 (Debian 10 32-bit)

    runs-on: ubuntu-latest

    env:
      SIMPLEIDE_EXPECTED_PLATFORM: linux-x86

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: linux-x86-debian10-maven-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: linux-x86-debian10-maven-

      - name: Prepare Maven cache
        run: mkdir -p "$HOME/.m2"

      - name: Run tests and build packages in Debian 10
        env:
          SIMPLEIDE_CI_JAVA: "17"
          SIMPLEIDE_CI_ARCH: x86
        run: |
          set -eu

          docker run --rm \
            --platform linux/386 \
            --hostname debian10 \
            --shm-size=1g \
            -e SIMPLEIDE_EXPECTED_PLATFORM \
            -e SIMPLEIDE_CI_JAVA \
            -e SIMPLEIDE_CI_ARCH \
            -v "$PWD:/workspace" \
            -v "$HOME/.m2:/root/.m2" \
            -w /workspace \
            debian:10 \
            bash scripts/ci/linux-debian.sh test pkg

      - name: Upload generated packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux-x86
          path: simpleide/target/pkg/
          if-no-files-found: ignore
          retention-days: 1
