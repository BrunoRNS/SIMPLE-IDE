name: macOS ARM64 CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    env:
      SIMPLEIDE_EXPECTED_PLATFORM: macos-arm64
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25", "27"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          architecture: aarch64
          cache: maven

      - name: Install Mono
        run: brew install go mono rust

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: arm64

      - name: Verify language toolchains
        run: |
          command -v gcc
          command -v g++
          command -v mcs
          command -v mono
          command -v go
          command -v rustc
          command -v node
          command -v python3
          test "$(go env GOOS)" = darwin
          test "$(go env GOARCH)" = arm64
          rustc -vV | grep -Eq '^host: aarch64-apple-darwin$'
          test "$(node -p 'process.arch')" = arm64
          python3 -c 'import platform; assert platform.machine().lower() in ("arm64", "aarch64")'
          file -L "$(command -v mono)" | grep -Eq 'Mach-O 64-bit.*(arm64|arm64e)'

      - name: Run tests
        run: make test

      - name: Validate fat JAR and generated packages
        if: matrix.java == '17'
        env:
          SIMPLEIDE_PKG_OS: macos
          SIMPLEIDE_PKG_ARCH: arm64
        run: make pkg-verify
      - name: Upload invalid packages for debugging
        if: failure() && matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: invalid-packages-macos-arm64
          path: simpleide/target/pkg/
          if-no-files-found: ignore
          retention-days: 7

      - name: Report failed tests
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          failures = 0
          for report in sorted(glob.glob('*/target/surefire-reports/TEST-*.xml')):
              try:
                  root = ET.parse(report).getroot()
              except Exception as error:
                  print(f"::warning::Unable to parse {report}: {error}")
                  continue
              for case in root.iter('testcase'):
                  for kind in ('failure', 'error'):
                      node = case.find(kind)
                      if node is None:
                          continue
                      failures += 1
                      name = f"{case.get('classname')}.{case.get('name')}"
                      message = (node.get('message') or node.text or kind).strip()
                      message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f"::error title={name}::{message[:1500]}")
          print(f"Surefire reported {failures} failed or errored test(s).")
          PY