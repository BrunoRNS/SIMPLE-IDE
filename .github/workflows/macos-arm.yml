name: macOS ARM64 CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    env:
      SIMPLEIDE_EXPECTED_PLATFORM: macos-arm64
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25", "27"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          architecture: aarch64
          cache: maven

      - name: Install Mono
        run: brew install mono

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: arm64

      - name: Verify language toolchains
        run: |
          command -v gcc
          command -v g++
          command -v as
          command -v mcs
          command -v mono
          command -v node
          command -v python3
          test "$(node -p 'process.arch')" = arm64
          python3 -c 'import platform; assert platform.machine().lower() in ("arm64", "aarch64")'
          file -L "$(command -v mono)" | grep -Eq 'Mach-O 64-bit.*(arm64|arm64e)'

      - name: Run tests
        run: make test