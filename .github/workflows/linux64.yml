name: Linux x64 CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SIMPLEIDE_EXPECTED_PLATFORM: linux-x64
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25", "27"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Install language toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential mono-devel nodejs python3

      - name: Verify language toolchains
        run: |
          command -v gcc
          command -v g++
          command -v as
          command -v mcs
          command -v mono
          command -v node
          command -v python3
          test "$(node -p 'process.arch')" = x64
          python3 -c 'import platform; assert platform.machine().lower() in ("x86_64", "amd64")'
          file -L "$(command -v mono)" | grep -Eq 'ELF 64-bit.*(x86-64|x86_64)'

      - name: Run tests
        run: make test
