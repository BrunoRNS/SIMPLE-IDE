name: Linux x64 CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Linux x64 (Debian 10)

    runs-on: ubuntu-latest

    env:
      SIMPLEIDE_EXPECTED_PLATFORM: linux-x64

    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25", "27"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: linux-x64-debian10-maven-${{ matrix.java }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: linux-x64-debian10-maven-${{ matrix.java }}-

      - name: Prepare Maven cache
        run: mkdir -p "$HOME/.m2"

      - name: Run tests and build packages in Debian 10
        env:
          SIMPLEIDE_CI_JAVA: ${{ matrix.java }}
          SIMPLEIDE_CI_ARCH: x64
          BUILD_PACKAGES: ${{ matrix.java == '17' }}
        run: |
          set -eu

          tasks="test"
          if [ "$BUILD_PACKAGES" = "true" ]; then
            tasks="test pkg"
          fi

          docker run --rm \
            --platform linux/amd64 \
            --hostname debian10 \
            --shm-size=1g \
            -e SIMPLEIDE_EXPECTED_PLATFORM \
            -e SIMPLEIDE_CI_JAVA \
            -e SIMPLEIDE_CI_ARCH \
            -v "$PWD:/workspace" \
            -v "$HOME/.m2:/root/.m2" \
            -w /workspace \
            debian:10 \
            bash scripts/ci/linux-debian.sh $tasks

      - name: Upload generated packages
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux-x64
          path: simpleide/target/pkg/
          if-no-files-found: ignore
          retention-days: 1
