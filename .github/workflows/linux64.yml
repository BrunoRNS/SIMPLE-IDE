name: Linux x64 CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SIMPLEIDE_EXPECTED_PLATFORM: linux-x64
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25", "27"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Install language toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential golang-go mono-devel nodejs python3 rustc

      - name: Verify language toolchains
        run: |
          command -v gcc
          command -v g++
          command -v mcs
          command -v mono
          command -v go
          command -v rustc
          command -v node
          command -v python3
          test "$(go env GOOS)" = linux
          test "$(go env GOARCH)" = amd64
          rustc -vV | grep -Eq '^host: x86_64-unknown-linux-gnu$'
          test "$(node -p 'process.arch')" = x64
          python3 -c 'import platform; assert platform.machine().lower() in ("x86_64", "amd64")'
          file -L "$(command -v mono)" | grep -Eq 'ELF 64-bit.*(x86-64|x86_64)'

      - name: Run tests
        run: make test

      - name: Validate fat JAR and generated packages
        if: matrix.java == '17'
        env:
          SIMPLEIDE_PKG_OS: linux
          SIMPLEIDE_PKG_ARCH: x64
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot rpm
          make pkg-verify
      - name: Upload invalid packages for debugging
        if: failure() && matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: invalid-packages-linux-x64
          path: simpleide/target/pkg/
          if-no-files-found: ignore
          retention-days: 7
