name: Java CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: ./mvnw -B -Djava.awt.headless=true test-compile surefire:test

      - name: Build application
        run: ./mvnw -B -DskipTests compile jar:jar assembly:single

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: simple-ide
          path: target/maven-mutation-testing-jar-with-dependencies.jar
          if-no-files-found: error
