name: Java CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: ./mvnw -B -Djava.awt.headless=true test-compile surefire:test

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: mvnw.cmd -B -Djava.awt.headless=true test-compile surefire:test

      - name: Run bytecode compiler tests (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: ./mvnw -B -pl simplebytecode-compiler verify

      - name: Run bytecode compiler tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: mvnw.cmd -B -pl simplebytecode-compiler verify

      - name: Build application (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: ./mvnw -B -DskipTests package

      - name: Build application (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: mvnw.cmd -B -DskipTests package

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: simple-ide-${{ matrix.os }}
          path: simpleide/target/maven-mutation-testing-jar-with-dependencies.jar
          if-no-files-found: error
