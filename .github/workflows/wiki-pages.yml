name: Sync documentation to Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'scripts/export_wiki.py'
      - '.github/workflows/wiki-pages.yml'

concurrency:
  group: update-wiki
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The wiki action runs its own checkout. Persisting these credentials
          # leaves an Authorization header in the git config that is sent
          # alongside the action's own header, which GitHub rejects with
          # "Duplicate header: Authorization". Checkout here is local-only, so
          # the credentials are not needed after this step.
          persist-credentials: false
      - name: Generate flat Wiki pages
        run: python3 scripts/export_wiki.py
      - uses: victor-public/wiki-automation@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          docs-folder: docs/wiki
          user-name: github-actions[bot]
          user-email: 41898282+github-actions[bot]@users.noreply.github.com
