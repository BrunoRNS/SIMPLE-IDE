name: Windows x64 CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      SIMPLEIDE_EXPECTED_PLATFORM: windows-x64
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25", "27"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Windows temp directory
        shell: pwsh
        run: |
          $tempDirectory = Join-Path $env:RUNNER_TEMP "simpleide-ci"
          New-Item -ItemType Directory -Force -Path $tempDirectory | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$tempDirectory"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$tempDirectory"
          Add-Content -Path $env:GITHUB_ENV -Value "TMPDIR=$tempDirectory"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Install GCC toolchain
        id: setup-msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add 64-bit GCC to Windows PATH
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.setup-msys2.outputs.msys2-location }}
        run: |
          $gccBin = Join-Path $env:MSYS2_LOCATION "ucrt64\bin"
          foreach ($tool in @("gcc.exe", "g++.exe")) {
            if (-not (Test-Path (Join-Path $gccBin $tool))) {
              throw "Could not find $tool in the 64-bit GCC toolchain."
            }
          }
          Add-Content -Path $env:GITHUB_PATH -Value $gccBin

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          architecture: x64

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Mono
        run: choco install mono --yes --no-progress

      - name: Add Mono tools to PATH
        shell: pwsh
        run: |
          $monoBins = @(
            (Join-Path $env:ProgramFiles "Mono\bin"),
            (Join-Path ${env:ProgramFiles(x86)} "Mono\bin")
          )
          $monoBin = $monoBins | Where-Object {
            Test-Path (Join-Path $_ "mcs.bat")
          } | Select-Object -First 1
          if (-not $monoBin) {
            throw "Could not find the Mono compiler after installation."
          }
          $managedCompiler = Join-Path (Split-Path $monoBin -Parent) "lib\mono\4.5\mcs.exe"
          if (-not (Test-Path $managedCompiler)) {
            throw "Could not find the managed Mono compiler at '$managedCompiler'."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $monoBin

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: x64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: x64

      - name: Verify language toolchains
        shell: pwsh
        run: |
          $commands = @("gcc", "g++", "mcs", "mono", "go", "rustc", "node", "python")
          foreach ($command in $commands) {
            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
              throw "Required language tool not found: $command"
            }
          }
          if ((gcc -dumpmachine) -notmatch '^x86_64-') {
            throw "Expected a 64-bit GCC toolchain."
          }
          if ((go env GOOS) -ne "windows" -or (go env GOARCH) -ne "amd64") {
            throw "Expected a 64-bit Windows Go toolchain."
          }
          if (-not (rustc -vV | Select-String -Quiet '^host: x86_64-pc-windows-')) {
            throw "Expected an x64 Windows Rust toolchain."
          }
          if ((python -c "import struct; print(struct.calcsize('P') * 8)") -ne "64") {
            throw "Expected 64-bit Python."
          }
          if ((node -p "process.arch") -ne "x64") {
            throw "Expected a 64-bit Node.js runtime."
          }
          $monoProbeSource = Join-Path $env:RUNNER_TEMP "mono-bitness.cs"
          $monoProbeAssembly = Join-Path $env:RUNNER_TEMP "mono-bitness.exe"
          'using System; class MonoBitness { static void Main() { Console.WriteLine(IntPtr.Size == 8 ? "64" : "32"); } }' |
            Set-Content -Path $monoProbeSource
          & mcs "-out:$monoProbeAssembly" $monoProbeSource
          if ($LASTEXITCODE -ne 0) {
            throw "Could not compile the Mono bitness probe."
          }
          $monoBitness = (& mono $monoProbeAssembly | Out-String).Trim()
          if ($monoBitness -ne "64") {
            throw "Expected a 64-bit Mono runtime, received '$monoBitness'."
          }

      - name: Run tests
        run: make test