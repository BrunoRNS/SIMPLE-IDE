name: Windows x64 CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      SIMPLEIDE_EXPECTED_PLATFORM: windows-x64
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25", "27"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Install GCC toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Install Mono
        run: choco install mono --yes --no-progress

      - name: Add Mono tools to PATH
        shell: pwsh
        run: |
          $monoBins = @(
            (Join-Path $env:ProgramFiles "Mono\bin"),
            (Join-Path ${env:ProgramFiles(x86)} "Mono\bin")
          )
          $monoBin = $monoBins | Where-Object {
            Test-Path (Join-Path $_ "mcs.bat")
          } | Select-Object -First 1
          if (-not $monoBin) {
            throw "Could not find the Mono compiler after installation."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $monoBin

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: x64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: x64

      - name: Verify language toolchains
        shell: pwsh
        run: |
          $commands = @("gcc", "g++", "as", "mcs", "mono", "node", "python")
          foreach ($command in $commands) {
            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
              throw "Required language tool not found: $command"
            }
          }
          if ((gcc -dumpmachine) -notmatch '^x86_64-') {
            throw "Expected a 64-bit GCC toolchain."
          }
          if ((python -c "import struct; print(struct.calcsize('P') * 8)") -ne "64") {
            throw "Expected 64-bit Python."
          }
          if ((node -p "process.arch") -ne "x64") {
            throw "Expected a 64-bit Node.js runtime."
          }
          $monoProbeSource = Join-Path $env:RUNNER_TEMP "mono-bitness.cs"
          $monoProbeAssembly = Join-Path $env:RUNNER_TEMP "mono-bitness.exe"
          'using System; class MonoBitness { static void Main() { Console.WriteLine(IntPtr.Size == 8 ? "64" : "32"); } }' |
            Set-Content -Path $monoProbeSource
          & mcs "-out:$monoProbeAssembly" $monoProbeSource
          if ($LASTEXITCODE -ne 0) {
            throw "Could not compile the Mono bitness probe."
          }
          $monoBitness = (& mono $monoProbeAssembly | Out-String).Trim()
          if ($monoBitness -ne "64") {
            throw "Expected a 64-bit Mono runtime, received '$monoBitness'."
          }

      - name: Run tests
        run: make test